[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-linkedin"
version = "0.1.0"
description = "Reverse-engineer your LinkedIn performance data into a personalized scoring formula and AI-powered post optimization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "AJ Green"},
]
keywords = ["linkedin", "content", "scoring", "optimization", "social-media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
]
training = [
    "torch>=2.0",
    "transformers>=4.40",
    "trl>=0.9",
    "peft>=0.11",
    "datasets>=2.19",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = ["midas-linkedin[llm,training,dev]"]

[project.scripts]
midas = "midas.cli:main"

[project.urls]
Homepage = "https://github.com/ajsai47/midas"
Repository = "https://github.com/ajsai47/midas"
Issues = "https://github.com/ajsai47/midas/issues"

[tool.setuptools.packages.find]
include = ["midas*"]

[tool.setuptools.package-data]
midas = ["data/*.yaml", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
